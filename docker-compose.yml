services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tripory-postgres
    restart: always
    environment:
      POSTGRES_DB: tripory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tripory_pgdata:/var/lib/postgresql/data

volumes:
  tripory_pgdata:
